<!doctype html><html><head><meta charset="utf-8"><style>
body{font:10px sans-serif;background:#fff;margin:4px}
.row{display:flex;align-items:center;border-bottom:1px solid #eee}
.row b{width:80px}
svg{width:110px;height:110px}
.fg-ground{stroke:#bbb;stroke-width:2}
.fg-near polyline,.fg-near-arm{stroke:#222;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.fg-far polyline{stroke:#999;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.fg-head{fill:#222}.fg-kb circle{fill:#e8590c}.fg-kb path{stroke:#e8590c;stroke-width:3}
</style></head><body><div id="g"></div>
<script src="../js/figure.js"></script><script src="../js/anims.js"></script>
<script>
const keys=(new URLSearchParams(location.search).get('k')||'').split(',').filter(Boolean);
const list=keys.length?keys:Object.keys(ANIMS);
for(const k of list){const r=document.createElement('div');r.className='row';r.innerHTML='<b>'+k+'</b>';
const n=Figure.frames(k).length;for(let i=0;i<n;i++){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');r.appendChild(s);Figure.still(s,k,i);}
document.getElementById('g').appendChild(r);}
</script></body></html>
